<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>DMC STUDENT DATABASE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4f7fc;
    }

    #app {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      background: #f4f7fc;
    }

    #dmc {
      position: absolute;

      /* สำคัญมาก */
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;
      border: 0;

      display: block;
      background: #f4f7fc;
    }

    @supports (height: 100dvh) {
      #app {
        height: 100dvh;
      }
    }

    @supports (height: 100svh) {
      #app {
        height: 100svh;
      }
    }

    /* iPhone safe area:
       ไม่ใส่ padding ด้านบน เพราะจะทำให้ App เลื่อน */
    @media (max-width: 900px) {
      #app {
        top: 0;
        padding: 0;
      }

      #dmc {
        top: 0;
        height: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <iframe
      id="dmc"
      title="DMC STUDENT DATABASE"
      allow="clipboard-read; clipboard-write"
    ></iframe>

  </div>


  <script>
    /*
     * ใส่ URL /exec ของ Apps Script ตรงนี้
     */
    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbwoyAzTu1UFCTbu2YOzzPkVMfFVWMCIA8CAVv86AvvCAw3EZ9C1fH834QDsdmqjghArMA/exec';


    /*
     * ใส่ query ใหม่ทุกครั้ง
     * ช่วยกัน browser ใช้ iframe/ตำแหน่ง scroll เก่า
     */
    const separator =
      GAS_URL.includes('?') ? '&' : '?';

    document.getElementById('dmc').src =
      GAS_URL +
      separator +
      'embed=1&ts=' +
      Date.now();
  </script>

</body>
</html>
